{% extends 'base.html' %}
{% load static %}
{% block title %}Recipe Book{% endblock %}
{% block content %}

{% if request.user.is_authenticated %}
    <h2>Welcome, {{ request.user.username }}!</h2>
{% endif %}


<ul>
    {% for recipe in object_list %}
    <li>
        <a href="/recipe/{{ recipe.id }}">{{recipe.name}}</a>
    </li>
    {% endfor %}
</ul>

{% endblock %}
